<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Amen Daycare — Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-page">
  <!-- STICKY HEADER -->
  <header id="site-header" class="header">
    <div class="container header-inner">
      <div class="brand">
        <a href="index.html" class="logo">🌼 Amen Daycare</a>
      </div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="index.html#programs">Programs</a>
        <a href="gallery.html" class="btn btn-small">Gallery</a>
        <a href="contact.html" class="btn btn-small">Contact</a>
      </nav>
      <button id="mobile-nav-toggle" class="mobile-toggle" aria-label="Toggle navigation">☰</button>
    </div>
  </header>

  <!-- GALLERY SECTION -->
  <section id="gallery" class="section container fade-up">
    <h2 class="section-title">Gallery</h2>
    <p class="section-sub">Moments from our daily learning & play.</p>

    <div class="gallery-grid">
      <!-- Playtime images -->
      <img src="images/playtime1.jpg" alt="Playtime 1" class="gallery-thumb" data-full="images/playtime1.jpg">
      <img src="images/playtime2.jpg" alt="Playtime 2" class="gallery-thumb" data-full="images/playtime2.jpg">
      <img src="images/playtime3.jpg" alt="Playtime 3" class="gallery-thumb" data-full="images/playtime3.jpg">
      <img src="images/playtime7.jpg" alt="Playtime 7" class="gallery-thumb" data-full="images/playtime7.jpg">
      <img src="images/playtime8.jpg" alt="Playtime 8" class="gallery-thumb" data-full="images/playtime8.jpg">
      <img src="images/playtime9.jpg" alt="Playtime 9" class="gallery-thumb" data-full="images/playtime9.jpg">

      <!-- Learning images -->
      <img src="images/learning1.jpg" alt="Learning 1" class="gallery-thumb" data-full="images/learning1.jpg">
      <img src="images/learning2.jpg" alt="Learning 2" class="gallery-thumb" data-full="images/learning2.jpg">
      <img src="images/learning3.jpg" alt="Learning 3" class="gallery-thumb" data-full="images/learning3.jpg">
      <img src="images/learning4.jpg" alt="Learning 4" class="gallery-thumb" data-full="images/learning4.jpg">
      <img src="images/learning5.jpg" alt="Learning 5" class="gallery-thumb" data-full="images/learning5.jpg">
      <img src="images/learning6.jpg" alt="Learning 6" class="gallery-thumb" data-full="images/learning6.jpg">
      <img src="images/learning8.jpg" alt="Learning 8" class="gallery-thumb" data-full="images/learning8.jpg">
      <img src="images/learning9.jpg" alt="Learning 9" class="gallery-thumb" data-full="images/learning9.jpg">
      <img src="images/learning10.jpg" alt="Learning 10" class="gallery-thumb" data-full="images/learning10.jpg">
      <img src="images/learning11.jpg" alt="Learning 11" class="gallery-thumb" data-full="images/learning11.jpg">
      <img src="images/learning12.jpg" alt="Learning 12" class="gallery-thumb" data-full="images/learning12.jpg">
      <img src="images/learning13.jpg" alt="Learning 13" class="gallery-thumb" data-full="images/learning13.jpg">
      <img src="images/learning14.jpg" alt="Learning 14" class="gallery-thumb" data-full="images/learning14.jpg">
    </div>

    <!-- LIGHTBOX -->
    <div id="lightbox" class="lightbox" aria-hidden="true">
      <button id="lb-close" class="lb-close" aria-label="Close">×</button>
      <img id="lb-img" src="" alt="">
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <p>© 2025 Amen Daycare | Growing with Love 🌷</p>
      <p><a href="contact.html" class="link">Contact Us</a> • 3602 Centennial Way NE, Tacoma, WA</p>
    </div>
  </footer>

  <!-- SCRIPTS -->
  <script>
    (function(){
      const header = document.getElementById('site-header');
      window.addEventListener('scroll', ()=> {
        if(window.scrollY > 40) header.classList.add('sticky');
        else header.classList.remove('sticky');
      });

      const mobileToggle = document.getElementById('mobile-nav-toggle');
      const nav = document.querySelector('.nav');
      mobileToggle.addEventListener('click', ()=> {
        nav.classList.toggle('open');
      });

      const thumbs = document.querySelectorAll('.gallery-thumb');
      const lightbox = document.getElementById('lightbox');
      const lbImg = document.getElementById('lb-img');
      const lbClose = document.getElementById('lb-close');

      thumbs.forEach(t => t.addEventListener('click', ()=> {
        lbImg.src = t.dataset.full || t.src;
        lightbox.style.display = 'flex';
        lightbox.setAttribute('aria-hidden','false');
      }));

      lbClose.addEventListener('click', ()=> {
        lightbox.style.display = 'none';
        lightbox.setAttribute('aria-hidden','true');
      });

      lightbox.addEventListener('click', (e)=> {
        if(e.target === lightbox) { 
          lightbox.style.display='none'; 
          lightbox.setAttribute('aria-hidden','true'); 
        }
      });

      window.addEventListener('load', ()=> {
        document.querySelectorAll('.fade-up').forEach((el, i)=>{
          setTimeout(()=> el.classList.add('visible'), i*120);
        });
      });
    })();
  </script>
</body>
</html>
